<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Perform Best: Highlander Athlete Care</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app shell — sticky header, one scrolling view per tab, fixed bottom tab bar; crisis button always one tap away. */
:root{
  --green:#1f4a33; --green-ink:#163826; --green-soft:#e6efe9;
  --gray:#53565a; --red:#c8102e; --red-soft:#fbe9ec;
  --bg:#f5f7f5; --surface:#ffffff; --fg:#1b2420; --muted:#5d6762; --line:#d8e0db;
  --on-green:#ffffff; --warn:#8a5a00; --warn-soft:#fff4dc;
  --display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
  --tartan:repeating-linear-gradient(45deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px),repeating-linear-gradient(180deg,rgba(30,90,67,0.55) 0px 22px,rgba(233,216,58,0.55) 22px 25px,rgba(30,90,67,0.55) 25px 45px,rgba(27,26,18,0.55) 45px 59px,rgba(44,95,158,0.55) 59px 73px,rgba(27,26,18,0.55) 73px 76px,rgba(44,95,158,0.55) 76px 80px,rgba(27,26,18,0.55) 80px 83px,rgba(44,95,158,0.55) 83px 97px,rgba(27,26,18,0.55) 97px 109px,rgba(30,90,67,0.55) 109px 129px,rgba(233,216,58,0.55) 129px 132px,rgba(30,90,67,0.55) 132px 152px,rgba(27,26,18,0.55) 152px 167px,rgba(239,237,230,0.55) 167px 172px,rgba(44,95,158,0.55) 172px 177px,rgba(239,237,230,0.55) 177px 201px,rgba(44,95,158,0.55) 201px 204px,rgba(239,237,230,0.55) 204px 207px,rgba(44,95,158,0.55) 207px 210px,rgba(239,237,230,0.55) 210px 233px,rgba(44,95,158,0.55) 233px 239px,rgba(239,237,230,0.55) 239px 242px),repeating-linear-gradient(90deg,#1e5a43 0px 22px,#e9d83a 22px 25px,#1e5a43 25px 45px,#1b1a12 45px 59px,#2c5f9e 59px 73px,#1b1a12 73px 76px,#2c5f9e 76px 80px,#1b1a12 80px 83px,#2c5f9e 83px 97px,#1b1a12 97px 109px,#1e5a43 109px 129px,#e9d83a 129px 132px,#1e5a43 132px 152px,#1b1a12 152px 167px,#efede6 167px 172px,#2c5f9e 172px 177px,#efede6 177px 201px,#2c5f9e 201px 204px,#efede6 204px 207px,#2c5f9e 207px 210px,#efede6 210px 233px,#2c5f9e 233px 239px,#efede6 239px 242px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --green:#6fbf8e; --green-ink:#0f2419; --green-soft:#16281e; --gray:#a7abaf;
  --red:#ff6b7f; --red-soft:#3a1a20; --bg:#0e1411; --surface:#16201b; --fg:#e7eee9;
  --muted:#9fb0a7; --line:#2a3a31; --on-green:#0e1411; --warn:#f2c46b; --warn-soft:#2e2511; color-scheme:dark}}
:root[data-theme="dark"]{
  --green:#6fbf8e; --green-ink:#0f2419; --green-soft:#16281e; --gray:#a7abaf;
  --red:#ff6b7f; --red-soft:#3a1a20; --bg:#0e1411; --surface:#16201b; --fg:#e7eee9;
  --muted:#9fb0a7; --line:#2a3a31; --on-green:#0e1411; --warn:#f2c46b; --warn-soft:#2e2511; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#1f4a33}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1;letter-spacing:.01em}
h2{font-size:2rem;font-weight:800;text-transform:uppercase}
h3{font-size:1.35rem;font-weight:700}
p{margin:0}
a{color:var(--green)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#1f4a33;background-image:linear-gradient(rgba(14,40,28,.62),rgba(14,40,28,.62)),var(--tartan);color:#fff;box-shadow:inset 0 -8px 0 transparent}
header::after{content:"";display:block;height:8px;background-image:var(--tartan)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo img{height:42px;width:auto;flex:none}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--display);font-size:1.45rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.brand span{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.sos{background:#c8102e;color:#fff;border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:.9rem;white-space:nowrap;box-shadow:0 0 0 3px rgba(255,255,255,.18)}

main{padding-block:20px 8px}
.view{display:flex;flex-direction:column;gap:22px}
.lede{color:var(--muted);max-width:60ch}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.note{font-size:.88rem;color:var(--muted)}
.draft{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);padding:2px 8px;border-radius:6px}

/* home */
.hello{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:end}
.hello>*{grid-column:1}
.hello .dog{grid-column:2;grid-row:1/span 2;width:120px;max-width:100%;height:auto}
.hello .lede{grid-column:1/-1}
.hello h1{font-size:2.6rem;font-weight:800;text-transform:uppercase}
.hello h1 em{font-style:normal;color:var(--red)}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.path{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;color:var(--fg);min-width:0}
.path b{font-family:var(--display);font-size:1.3rem;text-transform:uppercase;line-height:1.05}
.path small{color:var(--muted);font-size:.85rem;line-height:1.35}
.path.big{grid-column:1/-1;background:var(--green);border-color:var(--green);color:var(--on-green)}
.path.big small{color:var(--on-green);opacity:.85}
.quick{display:flex;flex-direction:column;gap:10px}

/* list rows */
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;color:var(--fg)}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t b{font-weight:700}
.row .t small{color:var(--muted);font-size:.85rem}
.row .go{color:var(--green);font-weight:700;font-size:1.2rem}
.tag{font-family:var(--display);font-weight:800;font-size:1rem;width:44px;height:44px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--green-soft);color:var(--green);text-transform:uppercase}

/* program detail */
.back{align-self:flex-start;background:none;border:0;color:var(--green);font-weight:700;padding:0}
.stop{background:var(--red-soft);border:1px solid var(--red);border-radius:var(--r);padding:14px 16px}
.stop h3{color:var(--red);font-size:1.15rem;margin-bottom:6px}
.stop ul{margin:0;padding-left:20px}
.phase{display:flex;flex-direction:column;gap:10px}
.phase-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.phase-head span{font-size:.85rem;color:var(--muted)}
.ex{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex b{font-weight:600}
.ex .dose{font-variant-numeric:tabular-nums;font-weight:700;color:var(--green);white-space:nowrap;align-self:start}
.ex small{grid-column:1/-1;color:var(--muted);font-size:.86rem}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--display);font-weight:800;font-size:1.3rem;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);color:var(--green)}
.steps li small{display:block;color:var(--muted);font-size:.86rem}

/* tracker */
.tracker{display:flex;flex-direction:column;gap:12px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{aspect-ratio:1;max-width:100%;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;font-weight:600}
.day.on{background:var(--green);border-color:var(--green);color:var(--on-green)}
.trk-sum{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.trk-sum b{font-family:var(--display);font-size:1.6rem}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;background:var(--green);color:var(--on-green);text-align:center;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn.red{background:#c8102e;color:#fff}

.gridwrap{overflow-x:auto;margin-inline:-4px}
.grid{border-collapse:collapse;width:100%;font-size:.84rem}
.grid th,.grid td{padding:5px 3px;border-top:1px solid var(--line);text-align:center}
.grid thead th{font-weight:700;color:var(--muted);font-size:.74rem;white-space:nowrap;border-top:0}
.grid thead th.done{color:var(--green)}
.grid tbody th{text-align:left;font-weight:600;min-width:120px;padding-right:8px;line-height:1.25}
.cell{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--on-green);font-weight:800}
.cell.on{background:var(--green);border-color:var(--green)}

/* mind tools */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.breathe{display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:8px}
.orb{width:180px;height:180px;max-width:100%;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);border:3px solid var(--green);transition:transform 4s ease-in-out}
.orb span{font-family:var(--display);font-weight:800;font-size:1.6rem;text-transform:uppercase;color:var(--green)}
.orb.big{transform:scale(1.18)}
@media (prefers-reduced-motion: reduce){.orb{transition:none}}
.ground{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.ground .n{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1;color:var(--red)}
.lib{display:flex;flex-direction:column;gap:10px}
.lib .row .tag{font-size:.72rem;letter-spacing:.04em}

/* help */
.lines{display:flex;flex-direction:column;gap:10px}
.line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.line .t{flex:1;min-width:0}
.line .num{font-family:var(--display);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums;user-select:all}
.copy{border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 12px;font-weight:600;font-size:.85rem}
.emer{background:#c8102e;color:#fff;border-radius:var(--r);padding:16px}
.emer h3{font-size:1.4rem}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px}
nav button{background:none;border:0;padding:8px 2px;border-radius:10px;color:var(--muted);font-weight:700;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:24px;height:24px}
nav button[aria-current="page"]{color:var(--green);background:var(--green-soft)}
nav button.help-tab[aria-current="page"]{color:var(--red);background:var(--red-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.9rem;z-index:20}
</style>

function recover(){
  return `<section class="view">
    <div class="stack"><span class="eyebrow">Recover</span><h2>Rehab programs</h2>
    <p class="lede">See the athletic trainer first. Once they've checked you out, use the program they point you to and log your days here.</p></div>
    <div class="stack">${PROGRAMS.map(p=>`<button class="row" data-open="recover:${p.id}"><span class="tag">${p.tag}</span><span class="t"><b>${esc(p.name)}</b><small>${esc(p.sub)}</small></span><span class="go">›</span></button>`).join("")}</div>
    <div class="card stack"><h3>Athletic trainers</h3><div class="lines">${people(STAFF.at)}</div>
    <a class="btn" href="${STAFF.atForm}" target="_blank" rel="noopener">Request an AT visit ↗</a></div>
  </section>`;
}

function program(id){
  const p = PROGRAMS.find(x=>x.id===id);
  if(p.concussion) return concussion();
  return `<section class="view">
    <button class="back" data-go="recover">‹ All programs</button>
    <div class="stack"><span class="eyebrow">Flexibility & strengthening</span><h2>${esc(p.name)}</h2>
    <p class="lede">The same program as your training room sheet. Your AT sets your reps and holds, and signs off on each day.</p></div>
    <div class="stop"><h3>Stop and see the AT if</h3><ul>${p.stop.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
    <div class="card phase"><h3>Exercises</h3>
      <div>${p.ex.map(e=>`<div class="ex"><b>${esc(e[0])}</b><small>${esc(e[1])}</small></div>`).join("")}</div>
      <p class="note">Descriptions are reminders. Do each exercise the way your AT showed you.</p></div>
    ${tracker(p)}
  </section>`;
}

function tracker(p){
  const g = store.get("grid-"+p.id, {});
  const dayDone = d => p.ex.every((_,r)=>g[r+"-"+d]);
  const days = [0,1,2,3,4].filter(dayDone).length;
  return `<div class="card tracker" id="trk">
    <div class="trk-sum"><h3>My 5-day sheet</h3><span><b>${days}</b> of 5 days done</span></div>
    <p class="note">Tap a box when you finish that exercise. Show this to your AT to sign off. Saved only on this phone.</p>
    <div class="gridwrap"><table class="grid">
      <thead><tr><th scope="col">Exercise</th>${[1,2,3,4,5].map(d=>`<th scope="col" class="${dayDone(d-1)?"done":""}">Day ${d}</th>`).join("")}</tr></thead>
      <tbody>${p.ex.map((e,r)=>`<tr><th scope="row">${esc(e[0])}</th>${[0,1,2,3,4].map(d=>{const on=!!g[r+"-"+d];return `<td><button class="cell${on?" on":""}" data-cell="${p.id}:${r}-${d}" aria-pressed="${on}" aria-label="${esc(e[0])}, day ${d+1}">${on?"✓":""}</button></td>`}).join("")}</tr>`).join("")}</tbody>
    </table></div>
    <button class="btn ghost" data-reset="${p.id}">Start a new sheet</button>
  </div>`;
}

function concussion(){
  return `<section class="view">
    <button class="back" data-go="recover">‹ All programs</button>
    <div class="stack"><span class="draft">Draft · AT review</span><h2>Concussion</h2>
    <p class="lede">You don't run this program on your own. The athletic trainer moves you from one step to the next. This page explains what to expect.</p></div>
    <div class="stop"><h3>Go to the ER or call 911 if</h3><ul>
      <li>A headache that keeps getting worse</li><li>Repeated vomiting</li><li>Slurred speech, weakness, or numbness</li>
      <li>You can't stay awake or can't be woken up</li><li>A seizure, or one pupil bigger than the other</li></ul></div>
    <div class="card stack"><h3>Every day: symptom checklist</h3>
      <p>Fill this out every day until the athletic trainer tells you to stop. It's how the AT knows when you're ready for the next stage.</p>
      ${STAFF.symptomLog?`<a class="btn" href="${STAFF.symptomLog}" target="_blank" rel="noopener">Open today's checklist ↗</a>`:`<span class="btn ghost" aria-disabled="true">Daily checklist · link coming</span>`}</div>
    <div class="card stack"><h3>The rules</h3>
      <p>If a concussion is suspected, you're done for the day. You need written clearance from a physician (MD or DO) to start the return-to-play stages, and California law requires at least 7 days after diagnosis before you can compete.</p></div>
    <div class="card stack"><h3>Step 1 · Return to learn</h3>
      <p class="note">You must be back to full school before starting any sports activity.</p>
      <ol class="steps">
        <li><div><b>Brain rest</b><small>Limit reading, texting, video games, and loud movies. You may need a few days at home.</small></div></li>
        <li><div><b>Partial days</b><small>A few classes or a half day, based on how you feel.</small></div></li>
        <li><div><b>Full school days</b><small>If recovery is slow, ask about a reduced schedule or lighter homework.</small></div></li>
      </ol></div>
    <div class="card stack"><h3>Step 2 · CIF return to play</h3>
      <p class="note">One stage per day at most. The AT, physician, or concussion monitor signs off on each stage you pass.</p>
      <ol class="steps">
        <li><div><b>Rest from exertion</b><small>No lifting, jogging, or PE until 2 full symptom-free days after seeing a physician</small></div></li>
        <li><div><b>Light aerobic</b><small>10–15 min walking or stationary bike, supervised</small></div></li>
        <li><div><b>Moderate aerobic + light bodyweight</b><small>20–30 min jog or bike, plus squats, planks, push-ups (1 set of 10)</small></div></li>
        <li><div><b>Hard aerobic + moderate weights</b><small>30–45 min run or bike, weights at half your max or less</small></div></li>
        <li><div><b>Non-contact sport drills</b><small>Cutting, jumping, sprinting, full lifting. No contact with people, pads, or the floor</small></div></li>
        <li><div><b>Contact practice</b><small>Needs written physician clearance turned in first, and at least one full-contact practice</small></div></li>
        <li><div><b>Competition</b><small>Back to normal game play</small></div></li>
      </ol></div>
    <div class="stop"><h3>If symptoms come back</h3><ul>
      <li>Stop all activity right away and tell the AT</li>
      <li>If you're symptom-free the next day, restart at the last stage you passed</li>
      <li>Can't pass a stage after 3 tries? You'll need more medical care</li></ul></div>
    <a class="btn ghost" href="${STAFF.cifRTP}" target="_blank" rel="noopener">Full CIF protocol (PDF) ↗</a>
    <a class="btn" href="${STAFF.atForm}" target="_blank" rel="noopener">Request an AT visit ↗</a>
  </section>`;
}

let libFilter = "All";
function mind(){
  const types=["All","Worksheet","Video","Slides"];
  const items = LIBRARY.filter(x=>libFilter==="All"||x.type===libFilter);
  return `<section class="view">
    <div class="stack"><span class="eyebrow">Mind</span><h2>Mental performance</h2>
    <p class="lede">Strategies and resources from our sports social workers. Use them any time, or bring them to a check-in.</p></div>
    <div class="stack">${STRATEGIES.map(s=>`<button class="row" data-open="mind:${s.id}"><span class="tag" style="font-size:.72rem">${s.tag}</span><span class="t"><b>${esc(s.name)}</b><small>${esc(s.sub)}</small></span><span class="go">›</span></button>`).join("")}</div>
    <div class="stack"><h3>Worksheets, videos & slides</h3>
      <div class="chips" role="group" aria-label="Filter resources">${types.map(t=>`<button class="chip" data-filter="${t}" aria-pressed="${t===libFilter}">${t}</button>`).join("")}</div>
      <div class="lib">${items.map(x=>{
        const ab={Worksheet:"PDF",Video:"VID",Slides:"PPT"}[x.type];
        return x.url
          ? `<a class="row" href="${esc(x.url)}" target="_blank" rel="noopener" style="text-decoration:none"><span class="tag">${ab}</span><span class="t"><b>${esc(x.name)}</b><small>${x.type}</small></span><span class="go">↗</span></a>`
          : `<div class="row"><span class="tag">${ab}</span><span class="t"><b>${esc(x.name)}</b><small>${x.type} · <span class="draft">Link coming</span></small></span></div>`;
      }).join("")}</div>
    </div>
  </section>`;
}

function strategy(id){
  const back = `<button class="back" data-go="mind">‹ Mind</button>`;
  if(id==="breathe") return `<section class="view">${back}
    <div class="stack"><h2>Box breathing</h2><p class="lede">Used by athletes and first responders to slow the heart down. Follow the circle: in, hold, out, hold, four seconds each.</p></div>
    <div class="card breathe"><div class="orb" id="orb"><span id="orbTxt">Ready</span></div>
      <p class="note" id="orbCount">4 rounds takes about a minute</p>
      <button class="btn" id="breatheBtn">Start</button></div>
  </section>`;
  if(id==="ground") return `<section class="view">${back}
    <div class="stack"><h2>5-4-3-2-1</h2><p class="lede">Pulls your attention out of your head and into the room. Say each one out loud or in your head.</p></div>
    <div class="card ground" id="ground"></div>
  </section>`;
  const g = GUIDES[id];
  return `<section class="view">${back}
    <div class="stack"><span class="draft">Draft · social work review</span><h2>${esc(g.title)}</h2><p class="lede">${esc(g.lead)}</p></div>
    <div class="card"><ol class="steps">${g.steps.map(s=>`<li><div><b>${esc(s[0])}</b><small>${esc(s[1])}</small></div></li>`).join("")}</ol></div>
    <div class="card stack"><p>Want to talk it through?</p><button class="btn ghost" data-go="help">Request a social worker check-in</button></div>
  </section>`;
}

function help(){
  const formBtn=(url,label)=> url
    ? `<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">${label}</a>`
    : `<span class="btn ghost" aria-disabled="true">${label} · form link coming</span>`;
  return `<section class="view">
    <div class="stack"><span class="eyebrow" style="color:var(--red)">Get help</span><h2>You don't have to handle it alone</h2></div>
    <div class="emer stack"><h3>In danger right now?</h3><p>Call 911, or go to the nearest emergency room. If you're on campus, go to any adult.</p></div>
    <div class="card stack"><h3>Talk to someone tonight, free and private</h3>
      <div class="lines">
        <div class="line"><div class="t"><div class="num">988</div><small class="note">Suicide & Crisis Lifeline · call or text, 24/7</small></div><button class="copy" data-copy="988">Copy</button></div>
        <div class="line"><div class="t"><div class="num">741741</div><small class="note">Crisis Text Line · text HOME, 24/7</small></div><button class="copy" data-copy="741741">Copy</button></div>
        <div class="line"><div class="t"><div class="num">888-724-7240</div><small class="note">San Diego Access & Crisis Line · 24/7</small></div><button class="copy" data-copy="888-724-7240">Copy</button></div>
      </div></div>
    <div class="card stack"><h3>Sports social worker</h3><div class="lines">${people(STAFF.sw)}</div>
      ${formBtn(STAFF.swForm,"Request a check-in ↗")}
      <p class="note">Checked on school days. Not for emergencies.</p></div>
    <div class="card stack"><h3>Athletic trainers</h3><div class="lines">${people(STAFF.at)}</div>
      ${formBtn(STAFF.atForm,"Request an AT visit ↗")}</div>
    <p class="note">Worried about a teammate? Tell a coach, the AT, or a social worker. Telling an adult is how you help.</p>
  </section>`;
}

/* ---------- ROUTER ---------- */
let current = {tab:"home", sub:null};
function render(){
  if(breatheTimer){clearInterval(breatheTimer);breatheTimer=null}
  const {tab,sub}=current;
  let html;
  if(tab==="recover") html = sub?program(sub):recover();
  else if(tab==="mind") html = sub?strategy(sub):mind();
  else if(tab==="help") html = help();
  else html = home();
  app.innerHTML = html;
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===tab?"page":"false"));
  if(sub==="ground") groundStep(0);
}
function go(tab,sub=null,scroll=true){current={tab,sub};render();if(scroll)window.scrollTo(0,0)}

const GROUND=[[5,"things you can see"],[4,"things you can feel"],[3,"things you can hear"],[2,"things you can smell"],[1,"slow breath, all the way out"]];
function groundStep(i){
  const el=document.getElementById("ground"); if(!el) return;
  if(i>=GROUND.length){el.innerHTML=`<h3>Nice work.</h3><p>Notice how you feel now compared to a couple of minutes ago.</p><button class="btn ghost" id="gAgain">Do it again</button>`;document.getElementById("gAgain").onclick=()=>groundStep(0);return}
  el.innerHTML=`<span class="n">${GROUND[i][0]}</span><h3>${GROUND[i][1]}</h3><p class="note">Step ${i+1} of 5</p><button class="btn" id="gNext">${i===4?"Done":"Next"}</button>`;
  document.getElementById("gNext").onclick=()=>groundStep(i+1);
}

function startBreathe(){
  const orb=document.getElementById("orb"), txt=document.getElementById("orbTxt"), cnt=document.getElementById("orbCount"), btn=document.getElementById("breatheBtn");
  const phases=["Breathe in","Hold","Breathe out","Hold"]; let i=0, round=1;
  btn.textContent="Stop";
  const tick=()=>{
    const ph=phases[i%4]; txt.textContent=ph;
    if(i%4===0) orb.classList.add("big"); if(i%4===2) orb.classList.remove("big");
    cnt.textContent="Round "+round+" of 4";
    i++; if(i%4===0) round++;
    if(round>4){clearInterval(breatheTimer);breatheTimer=null;setTimeout(()=>{txt.textContent="Done";orb.classList.remove("big");cnt.textContent="Go again any time";btn.textContent="Start"},4000)}
  };
  tick(); breatheTimer=setInterval(tick,4000);
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-go]"); if(!t) return;
  if(t.id==="sosBtn") return go("help");
  if(t.dataset.tab) return go(t.dataset.tab);
  if(t.dataset.go) return go(t.dataset.go);
  if(t.dataset.open){const [a,b]=t.dataset.open.split(":");return go(a,b)}
  if(t.dataset.filter){libFilter=t.dataset.filter;return go("mind",null,false)}
  if(t.dataset.copy) return copyText(t.dataset.copy);
  if(t.dataset.cell){const [pid,k]=t.dataset.cell.split(":");const g=store.get("grid-"+pid,{});if(g[k])delete g[k];else g[k]=true;store.set("grid-"+pid,g);
    const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(t.dataset.reset){store.set("grid-"+t.dataset.reset,{});const y=window.scrollY;render();window.scrollTo(0,y);toast("New sheet started");return}
  if(t.id==="breatheBtn"){if(breatheTimer){clearInterval(breatheTimer);breatheTimer=null;t.textContent="Start";document.getElementById("orbTxt").textContent="Ready";document.getElementById("orb").classList.remove("big")}else startBreathe()}
});

const h=(location.hash||"").slice(1);
go(["recover","mind","help"].includes(h)?h:"home",null,false);
</script>

</body></html>
